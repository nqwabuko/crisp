<rect width="900" height="410" fill="#FFFFFF"/>

<!-- the passage, drawn plainly: an explaining paragraph, then a padding one -->
<rect x="250" y="40" width="400" height="330" rx="10" class="box"/>
<rect x="262" y="56" width="376" height="190" class="f-signal"/>
<rect x="262" y="266" width="376" height="88" class="f-meter"/>
<text x="278" y="94" class="t-body"><tspan class="k-signal" font-weight="700">Three parts:</tspan> a sensor, a</text>
<text x="278" y="128" class="t-body">controller and a boiler.</text>
<text x="278" y="162" class="t-body"><tspan class="k-signal" font-weight="700">You might wonder why</tspan> the</text>
<text x="278" y="196" class="t-body">room overshoots. Heat is late,</text>
<text x="278" y="230" class="t-body"><tspan class="k-signal" font-weight="700">so</tspan> it keeps warming.</text>
<text x="278" y="304" class="t-body">At the end of the day, it is</text>
<text x="278" y="338" class="t-body">a really very common issue.</text>

<!-- left: the marks of an explanation -->
<path d="M240 87 H262" class="w-leader"/><circle cx="264" cy="87" r="4" class="p-plain"/>
<text x="230" y="94" class="l-signal r">List</text>
<text x="230" y="122" class="t-note r">every part kept</text>
<path d="M240 155 H262" class="w-leader"/><circle cx="264" cy="155" r="4" class="p-plain"/>
<text x="230" y="162" class="l-signal r">Anticipation</text>
<text x="230" y="190" class="t-note r">not padding</text>
<path d="M240 223 H262" class="w-leader"/><circle cx="264" cy="223" r="4" class="p-plain"/>
<text x="230" y="230" class="l-signal r">Joint</text>
<text x="230" y="258" class="t-note r">must survive</text>

<!-- right: what each paragraph owes the length gate -->
<path d="M636 151 H660" class="w-leader"/><circle cx="636" cy="151" r="4" class="p-plain"/>
<text x="670" y="158" class="l-signal">Explaining</text>
<text x="670" y="186" class="t-note">may grow 1.5x</text>
<path d="M636 310 H660" class="w-leader"/><circle cx="636" cy="310" r="4" class="p-plain"/>
<text x="670" y="317" class="l-meter">Padding</text>
<text x="670" y="345" class="t-note">owes the 40% cut</text>
</svg>
