<marker id="a-meter-reply" viewBox="0 0 10 10" refX="2.85" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#FFFFFF" stroke="#A86B12" stroke-width="1.5" stroke-linejoin="round"/></marker>
<marker id="a-meter-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A86B12" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-fuse-reply" viewBox="0 0 10 10" refX="2.85" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#FFFFFF" stroke="#C7332A" stroke-width="1.5" stroke-linejoin="round"/></marker>
<marker id="a-fuse-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#C7332A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-plain-reply" viewBox="0 0 10 10" refX="2.85" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#FFFFFF" stroke="#33423F" stroke-width="1.5" stroke-linejoin="round"/></marker>
<marker id="a-plain-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#33423F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-delay" viewBox="0 0 14 24" refX="7" refY="12" markerWidth="14" markerHeight="24" markerUnits="userSpaceOnUse" orient="auto"><rect x="2" y="8" width="10" height="8" fill="#FFFFFF"/><path d="M3 1 V23 M11 1 V23" fill="none" stroke="#12201E" stroke-width="2.5" stroke-linecap="round"/></marker>
<marker id="a-valve" viewBox="0 0 26 26" refX="13" refY="13" markerWidth="26" markerHeight="26" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L25 25 V1 L1 25 Z" fill="#FFFFFF" stroke="#12201E" stroke-width="2.5" stroke-linejoin="round"/></marker>
