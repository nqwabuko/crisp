<rect x="640" y="332" width="200" height="48" rx="10" class="box"/><text x="740" y="363" class="t-note c">if, 6 words</text>
<rect x="640" y="390" width="200" height="48" rx="10" class="box"/><text x="740" y="421" class="t-note c">if, 6 words</text>
