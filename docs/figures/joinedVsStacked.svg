<rect width="900" height="650" fill="#FFFFFF"/>

<!-- three sentences; box height is 8 px per word in every panel -->
<rect x="30" y="40" width="260" height="570" rx="10" class="container"/>
<text x="46" y="68" class="t-cont">Joined</text>
<rect x="60" y="100" width="200" height="152" rx="10" class="box"/>
<text x="160" y="185" class="t-title c">19 words</text>
<rect x="60" y="262" width="200" height="80" rx="10" class="box"/>
<text x="160" y="311" class="t-title c">so, 10 words</text>
<text x="160" y="580" class="t-note c">29 words: excused</text>

<rect x="320" y="40" width="260" height="570" rx="10" class="container"/>
<text x="336" y="68" class="t-cont">Stacked</text>
