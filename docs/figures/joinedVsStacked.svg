<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
<style>
.box{fill:#FFFFFF;stroke:#12201E;stroke-width:2.5}
.box-focus{fill:#FFFFFF;stroke:#12201E;stroke-width:5}
.box-power{fill:#D5EDE8;stroke:#12201E;stroke-width:2.5}
.box-signal{fill:#E7E2FB;stroke:#12201E;stroke-width:2.5}
.box-meter{fill:#F6E8CF;stroke:#12201E;stroke-width:2.5}
.box-fuse{fill:#F8DEDB;stroke:#12201E;stroke-width:2.5}
.box-ext{fill:#B9C4C1;stroke:#33423F;stroke-width:2.5}
.container{fill:#F2F4F3;stroke:#B9C4C1;stroke-width:2;stroke-dasharray:8 6}
.person{fill:#FFFFFF;stroke:#12201E;stroke-width:2.5}
.badge{fill:#12201E;stroke:none}
.frame{fill:none;stroke:#33423F;stroke-width:2}
.frame-tag{fill:#F2F4F3;stroke:#33423F;stroke-width:2}
.frame-sep{fill:none;stroke:#B9C4C1;stroke-width:2;stroke-dasharray:8 6}
.brace{fill:none;stroke:#33423F;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.loupe{fill:none;stroke:#12201E;stroke-width:3}
.stock{fill:#FFFFFF;stroke:#12201E;stroke-width:2.5}
.loop-badge{fill:#FFFFFF;stroke:#12201E;stroke-width:2.5}
.sum{fill:#FFFFFF;stroke:#12201E;stroke-width:2.5}
.f-power{fill:#D5EDE8;stroke:none}
.f-signal{fill:#E7E2FB;stroke:none}
.f-meter{fill:#F6E8CF;stroke:none}
.f-plain{fill:#F2F4F3;stroke:none}
.w-power{fill:none;stroke:#0E7A6B;stroke-width:4;stroke-dasharray:1 9;stroke-linecap:round}
.w-signal{fill:none;stroke:#6246D6;stroke-width:3;stroke-dasharray:10 7}
.w-meter{fill:none;stroke:#A86B12;stroke-width:3;stroke-dasharray:16 6}
.w-fuse{fill:none;stroke:#C7332A;stroke-width:3}
.w-plain{fill:none;stroke:#33423F;stroke-width:2.5}
.w-struct{fill:none;stroke:#33423F;stroke-width:2}
.w-leader{fill:none;stroke:#33423F;stroke-width:1.5}
.grid{fill:none;stroke:#B9C4C1;stroke-width:1}
.d-power{fill:none;stroke:#0E7A6B;stroke-width:3;stroke-dasharray:1 9;stroke-linecap:round;stroke-linejoin:round}
.d-signal{fill:none;stroke:#6246D6;stroke-width:3;stroke-dasharray:10 7;stroke-linejoin:round}
.d-meter{fill:none;stroke:#A86B12;stroke-width:3;stroke-dasharray:16 6;stroke-linejoin:round}
.d-fuse{fill:none;stroke:#C7332A;stroke-width:3;stroke-linejoin:round}
.d-plain{fill:none;stroke:#33423F;stroke-width:3;stroke-linejoin:round}
.belief{stroke-opacity:0.5}
.p-power{fill:#0E7A6B;stroke:none}
.p-signal{fill:#6246D6;stroke:none}
.p-meter{fill:#A86B12;stroke:none}
.p-fuse{fill:#C7332A;stroke:none}
.p-plain{fill:#33423F;stroke:none}
.t-title{font-family:'Barlow Condensed','Avenir Next Condensed',sans-serif;font-weight:600;font-size:27px;fill:#12201E}
.t-body{font-family:'Atkinson Hyperlegible','Avenir Next',sans-serif;font-size:22px;fill:#12201E}
.t-note{font-family:'Atkinson Hyperlegible','Avenir Next',sans-serif;font-size:21px;fill:#33423F}
.t-mono{font-family:'JetBrains Mono',Menlo,monospace;font-size:20px;fill:#12201E}
.t-cont{font-family:'Barlow Condensed','Avenir Next Condensed',sans-serif;font-weight:600;font-size:22px;fill:#33423F}
.t-badge{font-family:'Atkinson Hyperlegible','Avenir Next',sans-serif;font-weight:700;font-size:20px;fill:#FFFFFF}
.t-eq{font-family:'Atkinson Hyperlegible','Avenir Next',sans-serif;font-size:48px;fill:#12201E}
.t-var{font-family:'STIX Two Text';font-style:italic}
.t-op{font-family:'STIX Two Text';font-style:normal}
.t-sub{font-size:30px}
.k-power{fill:#0E7A6B}
.k-signal{fill:#6246D6}
.k-meter{fill:#A86B12}
.k-fuse{fill:#C7332A}
.l-power{font-family:'Atkinson Hyperlegible','Avenir Next',sans-serif;font-weight:700;font-size:21px;fill:#0E7A6B}
.l-signal{font-family:'Atkinson Hyperlegible','Avenir Next',sans-serif;font-weight:700;font-size:21px;fill:#6246D6}
.l-meter{font-family:'Atkinson Hyperlegible','Avenir Next',sans-serif;font-weight:700;font-size:21px;fill:#A86B12}
.l-fuse{font-family:'Atkinson Hyperlegible','Avenir Next',sans-serif;font-weight:700;font-size:21px;fill:#C7332A}
.c{text-anchor:middle}
.r{text-anchor:end}
</style>
<defs>
