<marker id="a-meter" viewBox="0 0 10 10" refX="2.85" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A86B12"/></marker>
<marker id="a-fuse" viewBox="0 0 10 10" refX="2.85" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C7332A"/></marker>
<marker id="a-plain" viewBox="0 0 10 10" refX="2.85" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#33423F"/></marker>
<marker id="a-stop" viewBox="0 0 6 22" refX="3" refY="11" markerWidth="6" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 H6 V22 H0 z" fill="#C7332A"/></marker>
<marker id="a-signal-reply" viewBox="0 0 10 10" refX="2.85" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#FFFFFF" stroke="#6246D6" stroke-width="1.5" stroke-linejoin="round"/></marker>
