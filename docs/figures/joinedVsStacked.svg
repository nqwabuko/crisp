<text x="450" y="210" class="t-title c">29 words</text>
<text x="450" y="244" class="t-note c">no joint</text>
<text x="450" y="580" class="l-fuse c">29 words: long</text>

<rect x="610" y="40" width="260" height="570" rx="10" class="container"/>
<text x="626" y="68" class="t-cont">Seven ifs</text>
