[package]
name = "crisp"
version = "0.1.0"
description = "De-slop and simplify prose: crisp's rules as a library and a CLI"
authors = ["Charlie O'Donoghue"]
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "crisp"
path = "src/lib.rs"

[[bin]]
name = "crisp"
path = "src/main.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Grammar and spelling in British English (`crisp grammar`, `src/grammar.rs`).
# Optional because the dictionary is several MB and ink measures every one.
# Default features off: the thesaurus is for synonym suggestions crisp never
# shows, and `concurrent` only swaps Rc for Arc.
harper-core = { version = "~2.11.0", optional = true, default-features = false }

[features]
default = ["grammar"]
grammar = ["dep:harper-core"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
# `panic = "abort"` is deliberately absent: ink will link this crate, and ink
# catches an engine panic rather than lose the window and the unsaved buffer.

# Harper builds its few hundred lints on every run, which takes seconds
# unoptimised; optimising the dependencies alone keeps `cargo test` quick.
[profile.dev.package."*"]
opt-level = 2
